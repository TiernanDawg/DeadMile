name: DeadMile
options:
  bundleIdPrefix: com.tiernan
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
    GENERATE_INFOPLIST_FILE: NO
    INFOPLIST_FILE: DeadMile/Info.plist
    SWIFT_STRICT_CONCURRENCY: minimal
targets:
  DeadMile:
    type: application
    platform: iOS
    sources:
      - path: DeadMile
      - path: Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tiernan.deadmile
        PRODUCT_NAME: DeadMile
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
